name: Verify deployment template

# The catalog ships no lockfile anymore: deployment/global/skill-sync.conf pins
# exact commits, and the per-target receipt/manifest pair records what apply
# wrote. Run on every PR to main so a template or wrapper change cannot ship
# without proving the full preview/apply/check/verify cycle, including the
# mutation cases `verify` must reject.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-deployment:
    name: Template gate and wrapper cycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The gate asserts the pinned catalog rev resolves in this history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the suite
        run: python3 -m unittest discover -s tests -v

  skillspector:
    name: SkillSpector static scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The scanner is installed from the exact commit pinned in
      # scripts/skillspector_scan.py with its own lockfile, so neither it nor
      # its dependencies can change without a reviewed edit to that pin.
      - name: Install the pinned scanner
        run: |
          python3 -m pip install --quiet uv==0.13.5
          PIN=$(python3 scripts/skillspector_scan.py --print-commit)
          SRC="$RUNNER_TEMP/skillspector"
          git init --quiet "$SRC"
          git -C "$SRC" fetch --quiet --depth 1 https://github.com/NVIDIA/SkillSpector.git "$PIN"
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$PIN"
          uv sync --frozen --no-dev --project "$SRC"

      - name: Scan every tracked skill
        env:
          SKILLSPECTOR_BIN: ${{ runner.temp }}/skillspector/.venv/bin/skillspector
        run: python3 scripts/skillspector_scan.py
