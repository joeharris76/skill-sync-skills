name: Verify lock

# The lock is only trustworthy if it is committed alongside the skill files it
# describes. Run on every PR to main so a commit cannot ship a stale snapshot.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-lock:
    name: Lock matches the tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Verify lock matches the tree
        run: python3 scripts/verify_lock.py
