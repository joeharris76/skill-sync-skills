# Global agent skill store. Template for the deployment project at
# ~/.skill-sync-deployment: copy this file to
# ~/.skill-sync-deployment/skill-sync.conf, point each `source` at a local
# checkout, and drive it with the vendored wrapper:
#
#   tools/skill-sync preview -C ~/.skill-sync-deployment
#   tools/skill-sync apply   -C ~/.skill-sync-deployment
#   tools/skill-sync verify  -C ~/.skill-sync-deployment
#
# skill-sync never fetches: every `source` must already exist on disk, and
# every `rev` must be present there. To ship an update, commit it in the
# owning repository and bump `rev` below through review, then re-apply.
# There is no dependency resolver: every skill the loaders need is listed.
#
# Global loader directories (~/.claude/skills, ~/.codex/skills) are symlinks
# into an immutable release snapshot, and skill-sync refuses to write through
# symlinks by design. So this config targets the plain directory
# `store/skills` inside the deployment project — never $HOME, never the live
# loader links. Promoting a validated store to a release and repointing the
# loader symlinks is a separate, explicitly approved activation step; see the
# repository README. The live release keeps serving until that happens.
#
# Format: https://github.com/joeharris76/skill-sync (bin/skill-sync).

target = store/skills

# Canonical shared catalog: joeharris76/skill-sync-skills. Untracked
# authoring work inside that checkout is never exported: `git archive` of the
# pinned commit below contains only committed bytes.
source = ~/Developer/skill-sync-skills
rev    = c8473708b5c7809700e8449ecde0dabcdc8e9892
dir    = skills
skill  = benchbox
skill  = blog
skill  = code
skill  = docs
skill  = memex-search
skill  = shared-agent-execution
skill  = shared-change-framework
skill  = shared-investigation-framework
skill  = shared-review-protocol
skill  = substack
skill  = session-takeover
skill  = test
skill  = tidy-perms
skill  = todo

# The skill-sync operator skill is owned by the product repository.
source = ~/Developer/skill-sync
rev    = 25e1e47693d8b0b2aba91d3ad3dbc0c14b8d3c4c
dir    = skills
skill  = skill-sync
