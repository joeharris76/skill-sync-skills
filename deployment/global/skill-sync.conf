# Global agent skill store. Template for the deployment config that manages
# the three global loader folders directly:
#
#   ~/.claude/skills   ~/.codex/skills   ~/.agents/skills
#
# The project root is the home directory ($HOME, passed as `-C ~`; it need
# not be a Git repository), so each `target` below is relative to it. The
# live config is kept outside the project root, at
# ~/.skill-sync-deployment/skill-sync.conf (copy this file there, then point
# each `source` at a local checkout). Drive it with the vendored wrapper:
#
#   tools/skill-sync preview -C ~ -f ~/.skill-sync-deployment/skill-sync.conf
#   tools/skill-sync apply   -C ~ -f ~/.skill-sync-deployment/skill-sync.conf
#   tools/skill-sync verify  -C ~ -f ~/.skill-sync-deployment/skill-sync.conf
#   tools/skill-sync check   -C ~ -f ~/.skill-sync-deployment/skill-sync.conf
#
# apply writes only the selected skills plus each target's manifest and
# receipt. It never removes loader-owned content: Claude Code's cloud-synced
# `synced/` (an id directory plus a `.bucket-<id>` marker) inside
# ~/.claude/skills, or Codex's `.system/` inside ~/.codex/skills.
#
# skill-sync never fetches: every `source` must already exist on disk, and
# every `rev` must be present there. To ship an update: commit it in the
# owning repository, bump `rev` below through review, copy the new rev into
# ~/.skill-sync-deployment/skill-sync.conf, then run apply, verify and check.
# There is no dependency resolver: every skill the loaders need is listed.
#
# skill-sync refuses to write through symlinks, so the loader folders must be
# real directories; the repository README has the one-time migration from the
# older symlink-to-snapshot layout, and the rollback.
#
# Format: https://github.com/joeharris76/skill-sync (bin/skill-sync).

target = .claude/skills
target = .codex/skills
target = .agents/skills

# Canonical shared catalog: joeharris76/skill-sync-skills. Untracked
# authoring work inside that checkout is never exported: `git archive` of the
# pinned commit below contains only committed bytes.
source = ~/Developer/skill-sync-skills
rev    = a315616052bd80c05928d3fe2604a938e1f6e4ee
dir    = skills
skill  = benchbox
skill  = blog
skill  = code
skill  = docs
skill  = memex-search
skill  = shared-change-framework
skill  = shared-investigation-framework
skill  = shared-review-protocol
skill  = substack
skill  = session-takeover
skill  = test
skill  = tidy-perms
skill  = todo

source = ~/Developer/skill-sync-skills
rev    = cb442602fe1ed5d85dab3dab8896284d44c67d9a
dir    = skills
skill  = shared-agent-execution

# The skill-sync operator skill is owned by the product repository.
source = ~/Developer/skill-sync
rev    = 25e1e47693d8b0b2aba91d3ad3dbc0c14b8d3c4c
dir    = skills
skill  = skill-sync
