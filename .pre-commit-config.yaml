# The deployment template is the only skill-sync configuration left in this
# repository. tests/test_skill_sync_conf.py validates it statically and runs a
# real preview/apply/check/verify cycle with the vendored wrapper, including
# the mutation cases `verify` must reject. .github/workflows/verify-deployment.yml
# enforces the same suite on PRs to main.
#
# This hook moves that gate to the commit itself. It takes no filenames; `files`
# only decides *when* it is worth running.
#
# Install once per checkout:  pre-commit install
repos:
  - repo: local
    hooks:
      - id: skill-sync-conf
        name: skill-sync deployment template matches the wrapper contract
        entry: python3 -m unittest tests.test_skill_sync_conf
        language: system
        pass_filenames: false
        files: ^(deployment/global/skill-sync\.conf|tools/skill-sync|tests/test_skill_sync_conf\.py)$
